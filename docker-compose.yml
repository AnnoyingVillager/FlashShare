services:
  app:
    image: ${FLASHSHARE_IMAGE:-ghcr.io/annoyingvillager/flashshare:edge}
    pull_policy: always
    restart: unless-stopped
    environment:
      FLASHSHARE_DATA_DIR: /data
      FLASHSHARE_LISTEN_ADDR: :8080
      FLASHSHARE_PUBLIC_BASE_URL: ${FLASHSHARE_PUBLIC_BASE_URL:-}
      FLASHSHARE_MASTER_KEY: ${FLASHSHARE_MASTER_KEY:-}
      FLASHSHARE_COOKIE_SECURE: ${FLASHSHARE_COOKIE_SECURE:-true}
      FLASHSHARE_TRUST_PROXY: ${FLASHSHARE_TRUST_PROXY:-true}
    ports:
      - "127.0.0.1:${FLASHSHARE_LOCAL_PORT:-8080}:8080"
    volumes:
      - flashshare-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      FLASHSHARE_DOMAIN: ${FLASHSHARE_DOMAIN:-share.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  flashshare-data:
  caddy-data:
  caddy-config:

